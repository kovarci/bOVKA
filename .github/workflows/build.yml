name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (règles de détection)
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bovka-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Lien fixe, sans connexion si le dépôt est public :
      # https://github.com/kovarci/bOVKA/releases/download/apk-latest/bovka.apk
      - name: Publish APK as release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bovka.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest bovka.apk --prerelease --target "$GITHUB_SHA" \
            --title "bOVKA (dernier build)" \
            --notes "Build de $GITHUB_SHA. Installer bovka.apk sur le téléphone."
